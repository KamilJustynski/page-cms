services:
  db:
    image: postgres:16-alpine
    container_name: page-cms-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: kamil
      POSTGRES_PASSWORD: kamil123
      POSTGRES_DB: pagecms
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
